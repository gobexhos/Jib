<style>
:root{--navy:#061632;--blue:#0b3c86;--cyan:#65d9ff;--glass:rgba(12,39,82,.72)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#eff8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 20% 0%,#1d65ad 0,transparent 38%),radial-gradient(ellipse at 90% 40%,#124b83 0,transparent 35%),linear-gradient(145deg,#030b1d,#092957 55%,#04152d);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#a8eaff 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.wrap{width:min(760px,100%);margin:auto;padding:30px 17px 70px;position:relative}
.hero{text-align:center;padding:35px 18px 27px;border:1px solid rgba(143,219,255,.35);border-radius:28px;background:linear-gradient(135deg,rgba(27,91,157,.65),rgba(5,23,55,.82));box-shadow:0 20px 60px #0007,inset 0 1px #ffffff30;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#61d9ff20;filter:blur(25px);top:-150px;right:-80px}
.kicker{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:#9be8ff}
h1{font-size:clamp(32px,8vw,58px);line-height:1.08;margin:12px 0;color:#fff;text-shadow:0 0 22px #55caff8c,0 4px 14px #001}
.sub{color:#c6e7ff;font-size:14px;margin:0}
.line{width:85px;height:3px;margin:20px auto 0;border-radius:9px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.gallery-title{display:flex;align-items:center;gap:12px;margin:30px 4px 15px;color:#d8f3ff;font-size:14px;letter-spacing:2px;text-transform:uppercase}
.gallery-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#66d9ff88,transparent)}
.photo-card{position:relative;margin:0 0 19px;padding:9px;border:1px solid #9cddff40;border-radius:22px;background:linear-gradient(145deg,rgba(37,102,163,.52),rgba(3,17,42,.82));box-shadow:0 14px 34px #0006;overflow:hidden}
.photo-card img{display:block;width:100%;height:auto;max-height:850px;object-fit:contain;border-radius:15px;background:#071a35}
.photo-caption{display:flex;justify-content:space-between;align-items:center;padding:11px 7px 3px;color:#cceaff;font-size:12px}
.photo-caption span:last-child{color:#80dcff;letter-spacing:2px}
.frog{position:fixed;z-index:5;width:62px;height:54px;pointer-events:none;filter:drop-shadow(0 8px 7px #0008);animation:hop 5.8s ease-in-out infinite}
.frog.one{left:2%;bottom:13%;animation-delay:-1s}
.frog.two{right:2%;top:26%;transform:scale(.78);animation-delay:-3.2s}
.frog.three{right:14%;bottom:4%;transform:scale(.62);animation-delay:-4.4s}
@keyframes hop{0%,100%{translate:0 0;rotate:-5deg}12%{translate:10px -55px;rotate:8deg}24%{translate:20px 0;rotate:-3deg}48%{translate:-8px 0;rotate:3deg}60%{translate:-20px -43px;rotate:-8deg}72%{translate:-28px 0;rotate:4deg}}
.footer{text-align:center;color:#8fc9ed;font-size:12px;padding:12px 0 0}
.spark{color:#8ce4ff}
@media(max-width:480px){.wrap{padding:17px 12px 55px}.hero{padding:29px 12px 24px;border-radius:23px}.photo-card{padding:7px;border-radius:18px}.frog{width:48px}.frog.one{left:-5px}.frog.two{right:-5px}}
@media(prefers-reduced-motion:reduce){.frog{animation:none}}
</style>
